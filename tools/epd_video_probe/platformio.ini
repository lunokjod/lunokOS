; **El banc de proves del vidre, com un projecte germà i no com un entorn del sistema** (0.190.127, l'amo: *«Mes cosetes per la
; pantalla eink! Vull que facis possible això dels 60hz»*). El `CMakeLists.txt` de lunokOS globa `src/` i no respecta cap
; `src_dir`, o sigui que un entorn dins del `platformio.ini` de dalt arrencaria el nucli sencer amb aquest `main` a sobre. Aquí
; no: aquest és un projecte PlatformIO seu, amb el seu `CMakeLists.txt` i el seu `sdkconfig`, i no comparteix ni una línia amb
; `../../src` ni amb `../../lib`. **Flashejar-lo no toca el disc ni la NVS de lunokOS**, i tornar al firmware de sempre és
; `pio run -e lilygo-t5s3-idf -t upload` des de l'arrel (docs/50, docs/80, docs/95).
[platformio]
default_envs = t5s3-epd-video
; **La definició de la placa viu al projecte gran** (docs/80): the board table is next to the root `platformio.ini` and this project
; uses the same one, o sigui que no hi ha dues idees de què és aquesta placa.
boards_dir = ../../boards

[env:t5s3-epd-video]
platform = espressif32@6.5.0
board = lilygo-t5s3-epaper-pro
framework = espidf
; **La taula de particions del sistema, la mateixa**, perquè el flaix no s'hagi de repartir de nou entre un firmware i l'altre: el
; probe no escriu a la flash, però una partició diferent sí que canvia el mapa i el retorn al sistema demanaria un `erase` (docs/70).
board_build.partitions = ../../partitions_16mb.csv
build_flags =
    -std=gnu++11
    -Wno-error=cpp
    -Wno-deprecated-declarations
    -Wno-error=volatile
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
