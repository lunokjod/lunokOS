# The safety net of docs/80: every push and every pull request runs the native suite, builds the
# six environments and refuses code the C++ compiler can see is unreachable. **Nothing here flashes
# a board**: docs/80 says a person does that, and the field measurements stay manual (docs/95).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The full history is what lets the version step walk the commits of this push or pull request.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # **Law 10, checked and not remembered**: every commit raises `kernel::kVersion`, in the same
      # commit, even the one that only touches a tool or a document (docs/80).
      - name: version bump
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"
          else
            # A new branch has no `before`: everything it added since the default branch is checked.
            BASE="$(git merge-base HEAD origin/HEAD 2>/dev/null || echo HEAD^)"
          fi
          python3 tools/check_version.py "$BASE" HEAD

      # One job and one cache: the five ESP32 environments share the same toolchain, so it is
      # downloaded once and not five times.
      - name: cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'boards/*.json') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: install PlatformIO, clang and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libsdl2-dev
          pip install 'platformio>=6.2,<7'

      # **The warning GCC does not have**: `-Wunreachable-code` is a no-op there, and the dead
      # scopes of 0.89.1 lived through `-Wall -Wextra -Werror`. Clang sees them (docs/80).
      #
      # **The includes are derived and not a list** (10/11): the list that used to be here was written
      # before the reader, so `lib/kernel/include/kernel/ui.h` asked for `epub/page.h` —and `ui.h` is
      # included by `ui.cpp`, `shell.cpp`, `button.cpp`, `touch.cpp` and `kernel.cpp`— and this step
      # failed on **every** run since with `fatal error: 'epub/page.h' file not found`: a red workflow
      # that said nothing about the code. A list of directories is a list to keep in step with `lib/`,
      # and nobody kept it; the loop below cannot fall behind. What is left out is the rule of the
      # emulator's own `lib_ignore` (platformio.ini): the board identities and the ESP32 halves are not
      # the host's business, and one of them inside the include path hides the host's `board/` (docs/50).
      #
      # **And the files are derived for the same reason** (0.177.3): the ten libraries listed here by
      # hand were the libraries of the day they were written, so `epub`, `zip` and `hal` —three the host
      # builds and this step never looked at— were outside the one check that sees an unreachable scope.
      # What is left out is the ESP32 halves, and **Lua, because it is C**: this is `clang++`, and the
      # interpreter as C++ is not the same program.
      - name: no unreachable code
        run: |
          set -euo pipefail
          INC="$(for d in lib/*/include; do
            case "$d" in
              lib/board_*|lib/hal_atom/include|lib/hal_paper/include|lib/hal_esp32/include|lib/hal_tkoala/include|lib/pal_esp32/include)
                continue ;;
            esac
            printf -- '-I%s ' "$d"
          done)"
          FILES="$(for f in lib/*/src/*.cpp; do
            case "$f" in
              lib/hal_atom/*|lib/hal_paper/*|lib/hal_esp32/*|lib/hal_tkoala/*|lib/pal_esp32/*)
                continue ;;
            esac
            printf '%s\n' "$f"
          done)"
          for f in $FILES; do
            echo "clang: $f"
            clang++ -std=c++11 -fsyntax-only $INC \
              -Wunreachable-code -Wunreachable-code-aggressive \
              -Werror=unreachable-code "$f"
          done

      - name: native tests
        run: pio test -e test

      # SDL2 is installed above on purpose: this compiles the window backend too, and not only
      # the bench without a glass.
      - name: build emulator
        run: pio run -e emulator

      - name: build atom
        run: pio run -e m5-atom

      - name: build atom_matrix
        run: pio run -e m5-atom-matrix

      - name: build paper
        run: pio run -e m5-paper

      - name: build esp32
        run: pio run -e esp32-devkit

      # **The sixth band, which this workflow never built** (0.177.3): `ttgo-t-koala` is an
      # environment of `platformio.ini` like the other five, and a board outside this job is a board
      # that can stop compiling without a red anywhere (docs/80).
      - name: build koala
        run: pio run -e ttgo-t-koala
