[env:lilygo-t5s3]
platform = espressif32@6.5.0
board = lilygo-t5s3-epaper-pro
framework = arduino
; 4 MB for the application and 11.9 MB for the disk: the same table the Paper uses, and the reason
; is the same —a board with a card-sized flash wants the room for books— (docs/70).
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
; **Les mateixes apps que el Paper, i per la mateixa regla i no per una llista** (0.190.80, l'amo: *«posa a la imatge
; del T5S3 els mateixos programes que l'm5paper»*). Fins a la 0.190.31 aquesta imatge portava **una** app —`luaperf`,
; l'única que no necessitava vidre— perquè el panell no pintava; amb el vidre conduit per epdiy la placa és una placa
; amb pàgina, i el que ha de portar és el mateix que la que més en porta. `custom_apps_in_disk = yes` agafa **cada
; carpeta d'`apps/` el manifest de la qual anomena aquesta placa o la seva família** (`esp32`), que és exactament la
; regla de la imatge del Paper: una llista escrita aquí es queda vella, una regla no. Una app que no hi entra ho diu a
; la compilació des de `make_disk` (avui només `rainbow`, que és dels ATOM) (docs/40, docs/70, docs/80).
custom_apps_in_disk = yes
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
; **El monitor és el port USB de la placa** (docs/50): aquesta no porta cap xip de pont —el seu USB-C és
; el de l'ESP32-S3— i la UART0 va al GPS, o sigui que el prompt surt pel port que hom endolla i la
; UART queda lliure. `monitor_speed` no vol dir res per a un CDC, però sí per a qui faci servir un
; adaptador extern en els pins 43/44, que és l'altra manera d'escoltar aquesta placa.
build_flags =
    -std=gnu++11
    -Ilib/board_t5s3/include
    ; **La pàgina amb què arrenca és la del Paper**: el llançador, que és el que una placa amb vidre i targeta vol veure
    ; en encendre's, i el que aquesta placa no podia tenir mentre el panell no pintava (0.190.80). Canviar-la no demana
    ; un flaish: `cfg home` ho fa, i `cfg home none` torna al prompt (docs/30, docs/40).
    -DLUNOK_HOME_APP=\"home_eink\"
    ; **Els canaris de la memòria, encesos a propòsit** (0.190.101, l'amo: *«millor fem les proves que volies fer amb els canaris i tota
    ; la pesca»*): every block of the extra memory carries a head and a tail with its size, o sigui que una escriptura més enllà del que
    ; es va demanar es veu al primer `release`/`resize` d'aquell bloc en comptes de fer caure el `tlsf` sense dir res. És un build de
    ; diagnòstic — trenta-dos bytes per bloc i una còpia a cada `resize`— i el dia que el forat estigui tapat, aquesta línia marxa
    ; (docs/75, docs/95).
    -DLUNOK_MEMORY_GUARDS=1
    ; **La consola d'aquesta placa és el USB i no la UART** (0.190.30): the board has **no bridge chip** —its USB-C is
    ; the chip's own USB—, so a console on UART0 would come out on GPIO43/GPIO44, which go to the GPS module and to
    ; nothing a person can read. The vendor's own Arduino settings say the same (`USB CDC On Boot: Enable`), i el que
    ; això deixa és **la UART0 lliure per al GPS** i el port sèrie del PC servint el prompt del sistema (docs/50).
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; The same 16 KB of stack the Paper needs: a page of controls, a font of outlines and the
    ; interpreter share one task (docs/75).
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    hal_emulator
    pal_host
    ; Every other board's identity and HAL: with two of them on the include path, which
    ; board/identity.h is seen would depend on the order of `lib/` (docs/50).
    board_atom
    board_matrix
    board_esp32
    board_paper
    board_tkoala
    hal_atom
    hal_paper
    hal_tkoala
    ; The radio and the TLS are the system's (docs/50).
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

; The ATOM Matrix is the Lite's twin for everything PlatformIO decides: the same
; ESP32-PICO-D4, the same 4 MB of flash, the same table, the same button on GPIO39
; and the same console, so `board =` is the same and every option is inherited
; instead of copied. What it is not is the same board: it has a 5 by 5 panel of
; twenty-five lights on GPIO27 where the Lite has one, and `sys.board` has to be
; able to say so (docs/50). That is the whole difference and it is two things: this
; include path and the `led_count()` inside it. build_flags and lib_ignore are
; written again because a child section replaces the parent's list, it does not
; extend it — and `board_atom` has to go, or the Lite's identity would be the one
; the finder sees.
; **Un entorn d'ESP-IDF de debò, al costat del d'Arduino i sense tocar-lo** (0.190.90, l'amo: *«podriem portar el projecte a esp_idf i així
; compilar com ens surti dels collons les coses?»*). El motiu concret és el vidre: `epdiy` parteix el rellotge del bus a la meitat quan veu
; que la línia de la memòria cau és de 32 B, i amb el nucli d'Arduino **no es pot canviar** —les lliberries venen compilades amb aquell
; número a dins (docs/50). Aquí el `sdkconfig` és nostre: 64 B de línia, PSRAM octal a 80 MHz, la consola al USB del xip, la taula de
; particions de sempre i la pila del nucli a 16 KB. **No substitueix l'entorn d'Arduino**: conviu amb ell mentre no estigui provat a la placa.
[env:lilygo-t5s3-idf]
platform = espressif32@6.5.0
board = lilygo-t5s3-epaper-pro
framework = espidf
; 4 MB for the application and 11.9 MB for the disk: the same table the Paper uses (docs/70).
board_build.partitions = partitions_16mb.csv
; **I el disc, el mateix que el de l'entorn d'Arduino** (0.190.90): `make_disk.py` el compon a `build/disk/<env>` —les apps que el
; manifest de cada una diu que són d'aquesta placa, la splash feta pla, les fonts i el llibre— i el deixa a `$PROJECT_DATA_DIR`, i el
; `mklittlefs` de la plataforma el converteix en la imatge de la partició que diu la taula. O sigui que aquest entorn no és mitja placa:
; porta les mateixes apps que el de sempre (docs/70, docs/80).
board_build.filesystem = littlefs
; **La velocitat de gravat no es diu aquí**: viu a `boards/lilygo-t5s3-epaper-pro.json` (921600, la de la guia del fabricant) i val per
; a tots els entorns d'aquesta placa, que és el que ha de ser (docs/50, docs/80).
; **I les mateixes apps que l'entorn d'Arduino, per la mateixa regla** (0.190.80): cada carpeta d'`apps/` el manifest de la qual
; anomena aquesta placa o la família `esp32`. Una llista escrita a mà es queda vella; la regla no (docs/40, docs/70).
custom_apps_in_disk = yes
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -std=gnu++11
    -Ilib/board_t5s3/include
    -DLUNOK_HOME_APP=\"home_eink\"
    ; **La consola és el USB del xip** (docs/50): aquesta placa no porta cap pont i la UART0 va al GPS, o sigui que el prompt surt pel
    ; perifèric USB-Serial-JTAG del propi ESP32-S3 i no per la UART.
    -DLUNOK_CONSOLE_USB=1
    ; **Els avisos de la IDF no són errors aquí**: el build d'Arduino no en té cap perquè la seva configuració no marca com a error els
    ; `#warning` del driver d'ADC antic, i el codi que els provoca (`battery`, el gauge, el tàctil) funciona igual. Migrar-lo a
    ; `adc_oneshot` és una feina a part i no ha de fer caure l'entorn de prova (docs/50, docs/80).
    -Wno-error=cpp
    -Wno-deprecated-declarations
    ; I els `printf` d'epdiy, que són de la seva lliberry i no nostres: la IDF 5 els mira amb `-Werror=format` i la 4.4 d'Arduino no
    ; (docs/50, docs/80).
    -Wno-error=format
    ; **`-Wno-error=volatile` i no `-Wno-volatile`** (0.190.90): `uart_ll.h` de la IDF fa assignacions compostes sobre un `volatile` i el
    ; GCC 12 ho marca obsolet, però aquesta bandera només existeix per a C++ i `build_flags` arriba també als fitxers `.c` —amb la forma
    ; forta, cada un dels centenars de `.c` de la IDF cridava que la bandera no era seva (971 línies en una compilació neta). Amb
    ; `-Wno-error` els dos avisos del seu capçalera es queden com a avisos i la compilació calla (docs/50, docs/80).
    -Wno-error=volatile
    ; **Els canaris de la memòria, encesos a propòsit** (0.190.101, l'amo: *«millor fem les proves que volies fer amb els canaris i tota
    ; la pesca»*): every block of the extra memory carries a head and a tail with its size, o sigui que una escriptura més enllà del que
    ; es va demanar es veu al primer `release`/`resize` d'aquell bloc en comptes de fer caure el `tlsf` sense dir res. És un build de
    ; diagnòstic — trenta-dos bytes per bloc i una còpia a cada `resize`— i el dia que el forat estigui tapat, aquesta línia marxa
    ; (docs/75, docs/95).
    -DLUNOK_MEMORY_GUARDS=1
lib_ignore =
    hal_emulator
    pal_host
    board_atom
    board_matrix
    board_esp32
    board_paper
    board_tkoala
    hal_atom
    hal_paper
    hal_tkoala
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

[env:m5-atom-matrix]
extends = env:m5-atom
; **The demo of the panel travels in the image of this board and of no other** (12/11, the owner: *«afegeix aquesta app
; al littlefs de només el Atom Matrix i l'emulador atom matrix»*): `custom_apps` is the exact list `make_disk` puts in
; the littlefs, and the filter of `boards` is applied on top, so a name that this board could not `run` stays out and
; says so (docs/70). **The Lite does not carry it** —its face is one light and the five by five is not its board— and
; neither does the Paper, which carries every app that names it and this one names the two ATOMs (docs/40). It is
; **28 490 B in four files** —8 355 of Lua, the icon of 4 206, its master of 15 419 and the manifest— and the image it
; goes into is the one 0.179.9 emptied of the splash, the faces and the reader (docs/70, docs/75).
custom_apps = rainbow
build_flags =
    -std=gnu++11
    -Ilib/board_matrix/include
    ; The app that comes up with the board: empty for the prompt (see the ATOM, 0.119.0).
    -DLUNOK_HOME_APP=\"\"
    ; The child replaces its father's list instead of extending it: the stack is said again (docs/75).
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_emulator
    pal_host
    board_atom
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

[env:emulator]
platform = native
; **Aquest entorn no és de proves i no en pot ser** (0.179.56): una compilació de proves a l'entorn de l'emulador no
; enllaça el PAL (`src/board_link.cpp` no es compila sense `test_build_src`) i escriu el binari de les suites al
; mateix `program` que hom executa per mirar el vidre. Les proves viuen a `[env:test]`, que té el seu disc i el seu
; `LUNOK_HOME_APP` buit, i `pio test` hi va sol des de 0.179.56 (`default_envs`). Aquí no hi ha cap suite.
test_ignore = *
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=c++11
    -Ilib/hal_emulator/include
    ; **The app the emulator comes up with: the launcher** (0.155.0, and it is the owner's ask: *«que l'emulador arrenqui
    ; amb el paràmetre --gui i l'app per defecte home_eink»*). The emulator has a glass and three keys, so the page a
    ; person wants to see is the grid of the apps, and back to it when the app they opened ends (docs/30, docs/40).
    ; **It is the app the disk carries** (`custom_apps_in_disk` below, which since 8/11 puts every app of `apps/`
    ; on the emulator's disk, the launcher among them), and `--no-gui` and `cfg home none` are the two ways
    ; out of it without a build. No test is affected: the suite has its own environment with the home app empty.
    -DLUNOK_HOME_APP=\"home_eink\"
    ; **The window is what this emulator comes up with** (0.155.0): the run opens the glass in a window without being
    ; asked, because an emulator that shows nothing is an emulator one has to remember to ask for a page. A demand is not a
    ; default (`--gui` still refuses `--no-delay` and `--no-ink`, and the default steps aside and says so), and
    ; `--no-gui` is the quiet emulator of a measure (docs/85).
    -DLUNOK_GUI_BY_DEFAULT=1
    ; **The disk this binary reads**, and it is this build's own: `make_disk` assembles `build/disk/emulator`
    ; and the code of the emulator takes the path from here, so the emulator and the tests cannot write over each
    ; other's disk (docs/80, docs/85).
    -DLUNOK_DISK_DIR=\"build/disk/emulator\"
; **The window of the emulator**: SDL2 when it is installed, Xlib as the POSIX fallback, and an emulator with no
; window when neither is there (in which case `LUNOK_GUI_BY_DEFAULT` prints that there is no window and the run
; goes on with the console). `LUNOK_GUI=sdl|x11|none` forces one; SDL2_CFLAGS and SDL2_LIBS let a build point at
; a copy that pkg-config does not know (docs/85).
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/select_gui.py
; **The emulator carries every app of `apps/`** (8/11, the owner: *«afegeix totes les apps a l'emulador»*). Until
; today it carried the launcher alone —the app it comes up with has to be on the disk it reads— and the rest stayed
; out, so a fresh emulator showed a grid with one cell. `custom_apps_in_disk = yes` keeps **the apps that name this
; board**, and the emulator has no board, so the rule of `make_disk` keeps them all: 9 folders, 42 files, 331 536 B on
; this machine, and they go in as **links** —an edit of an app is read by the next run—. A board is what keeps a
; short list (`m5-paper` names its six): its 4 MB of LittleFS do not hold `apps/` (docs/70, docs/85).
custom_apps_in_disk = yes
; **The card is not filled by the build** (11/11, the owner: *«treu les apps del SD per ara»*): the emulator's
; apps are the disk's, and the card in its slot is a directory of this machine that a person fills —with `repo
; install`, with a hand— exactly like the card of a board. It used to be seeded with a link per app (10/11) and that
; showed every app twice in the door of `/apps`, once from each volume (docs/70, docs/85).
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_atom
    hal_paper
    ; What belongs to the ESP32 is not this band's business either: hal_esp32 talks
    ; to the IDF and the Arduino core, and nothing on the PC includes it (docs/50).
    hal_esp32
    pal_esp32
    ; The board identities of the chips are not this band's business: one of them
    ; inside the include path would hide the emulator's own board/impl.h (docs/50).
    board_atom
    board_matrix
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala

[env:test]
platform = native
test_framework = unity
; src/ is compiled for the tests too: that is where board_link.cpp lives, and it
; is what links the board and the PAL in.
test_build_src = yes
; The tests read the disk the same way the emulator does, so they get the same tree
; with the apps in it (docs/80).
extra_scripts =
    pre:tools/make_disk.py
custom_apps_in_disk = yes
; **The apps are copies here and links everywhere else**: a test creates and deletes apps in the disk it
; mounts, and writing through a link would write into the repository (docs/80, docs/85).
custom_apps_copied = yes
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=c++11
    -Ilib/hal_emulator/include
    ; **None, and it is not a detail** (0.119.0): every test boots the kernel, so a home app here would open an app
    ; in the middle of a case. The cases that want one set it themselves (docs/30, docs/85).
    -DLUNOK_HOME_APP=\"\"
    ; **The tests read their own disk**, `build/disk/test`, assembled by `make_disk` for this environment: a
    ; green suite says nothing about a disk somebody else left behind (docs/80, docs/85).
    -DLUNOK_DISK_DIR=\"build/disk/test\"
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_atom
    hal_paper
    ; Same reason as the emulator above: the ESP32 parts are not compiled for the PC.
    hal_esp32
    pal_esp32
    ; Same reason as the emulator above: one identity per environment.
    board_atom
    board_matrix
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala

; The M5 Paper (v1.0 and v1.1, the same firmware: docs/50) is the second chip this
; project builds for and it shares almost nothing with the ATOM: 16 MB of flash
; instead of 4, 8 MB of PSRAM, a 4.7" e-ink panel on an IT8951E, a touch panel, a
; clock chip with a coin cell, three keys and no light at all. It is not `extends`
; the ATOM's environment for that reason: the partition table, the board and the
; HAL are different, and inheriting would only hide which of them is which.
;
; The identity is the familiar trick: `-Ilib/board_paper/include` picks this
; board's board/identity.h, and every other board is ignored (docs/50).
[env:m5-paper]
platform = espressif32@6.5.0
board = m5stack-paper
framework = arduino
; 4 MB for the application and 11.9 MB for the disk: an app that keeps a book
; wants the room (partitions_16mb.csv).
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
; **The Paper is the one board whose image carries apps, and it carries every one of them** (the owner, 11/11:
; *«per qué el m5Paper no te totes les apps al littlefs com HE DEMANAT ABANS?»*). It was a list of names written here
; —eleven of them, one per app that had arrived— and a list is a thing that goes stale: `2048` was ported and the image
; kept eleven apps, so the launcher of the board did not have the game and nobody found out until the board was flashed.
; **The filter is the rule now and not a list**: `custom_apps_in_disk = yes` carries every folder of `apps/` whose
; manifest names this board or its family, which is what the launcher shows and what a person expects of the board with
; the biggest disk of the project (12 451 840 B of LittleFS against 1,5 MB of disk with the eleven apps of the 0.179.15).
; A name that is not carried says why at build time, from `make_disk`: `light` names the ATOM, so it stays out (docs/70).
custom_apps_in_disk = yes
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -std=gnu++11
    -Ilib/board_paper/include
    ; **The app the Paper comes up with** (0.119.0): **the launcher** (0.153.0). A board with a glass is the one that
    ; can want one —`-DLUNOK_HOME_APP=\"clock\"` makes it come up showing the clock— and `cfg home` changes it
    ; without a flash (docs/30, docs/40). `home_eink` is what a person expects of a board with three keys and no
    ; keyboard: the grid of the apps, and back to it when the app they opened ends. `cfg home none` puts the prompt
    ; back on the board without a flash, and a disk that has lost the app leaves the prompt with `[W][HOME]`, never a
    ; boot loop (docs/40).
    -DLUNOK_HOME_APP=\"home_eink\"
    ; **The stack of the loop task is 16 KB** and not the 8 the core defaults to: the UI of a page of
    ; controls, the reader of a TrueType font and the interpreter all run in that one task, and
    ; `run buttons` on this board rebooted with a corrupted backtrace at 8 (docs/75).
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_emulator
    pal_host
    ; The ATOM's HAL and both of its identities: this band has one identity and
    ; one HAL of its own (docs/50).
    hal_atom
    board_atom
    board_matrix
    board_esp32
    board_tkoala
    hal_tkoala
    ; The radio and the TLS are the system's (docs/50): Arduino's network classes
    ; are outside the build on every board.
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

; **The smallest board the system has to fit in**: an ESP32 DevKit of 4 MB of
; flash and 520 KB of RAM, with no PSRAM, no panel, no card, no sensor and no
; button it can press. It exists so that a page of code that only works because
; the Paper has four megabytes of extra memory fails here and not there (docs/80).
;
; It is not `extends` the ATOM's environment even though the chip is the same:
; that one is a board with a light and a button and this one is a bare module, and
; inheriting would hide which of the two numbers is whose.
;
; What the family HAL drives anyway: the light of the family is on GPIO27 and the
; key on GPIO39, and a DevKit has nothing on either —so `led.play` writes to a pin
; with no chip and the dial reads "not pressed" for ever, and the way in and out of
; an app is the console. That is said in the identity header too (docs/50).
; **La M5 Paper en el build d'ESP-IDF** (0.190.166, l'amo: *«Al compilar per m5paper... Fes una placa nova, la m5-paper-idf, migrarem aquesta
; placa a esp_idf»*). És la mateixa placa i el mateix HAL que l'entorn d'Arduino —`hal_paper` ja parla la IDF de dalt a baix i el driver del
; panell és el del propi sistema—, o sigui que aquest entorn no és mitja placa: porta el mateix disc, les mateixes apps i la mateixa
; configuració, amb una diferència de debò, que és el que la migració busca —la memòria deixa de tenir el sostre del nucli d'Arduino—.
; **La configuració va en un fitxer seu** (`sdkconfig.m5-paper-idf`): el `sdkconfig.defaults` del projecte és el de l'ESP32-S3 i els dos
; entorns d'IDF no poden compartir-lo (docs/50, docs/80).
[env:m5-paper-idf]
platform = espressif32@6.5.0
board = m5stack-paper
framework = espidf
; La mateixa taula de particions i el mateix disc que l'entorn d'Arduino (docs/70).
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
custom_apps_in_disk = yes
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
; **La configuració d'aquesta placa i no la del S3** (vegeu el comentari de dalt).
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults.m5-paper-idf"
build_flags =
    -std=gnu++11
    -Ilib/board_paper/include
    -DLUNOK_HOME_APP=\"home_eink\"
    ; **Els avisos i els `printf` de les lliberries no són errors aquí**: la IDF 5 mira el format amb `-Werror` i el driver vell de l'ADC
    ; crida la seva pròpia obsoletessa, que és el mateix que l'entorn del T5S3 ja diu (docs/50, docs/80).
    -Wno-error=cpp
    -Wno-deprecated-declarations
    -Wno-error=format
    -Wno-error=volatile
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_emulator
    pal_host
    hal_atom
    board_atom
    board_matrix
    board_esp32
    board_tkoala
    hal_tkoala
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

[env:esp32-devkit]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
; **The bare ESP32 carries no apps either**: its disk is the system alone, the same rule as every board (docs/70).
custom_apps_in_disk = no
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -std=gnu++11
    -Ilib/board_esp32/include
    ; The app that comes up with the board: empty for the prompt (0.119.0).
    -DLUNOK_HOME_APP=\"\"
    ; **The stack of the loop task is 16 KB** here too: what needs it is the UI of a page of controls and the
    ; reader of a font of outlines, and that is the same on a DevKit as on the Paper (docs/75).
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_emulator
    pal_host
    ; The other four identities: one per environment, and theirs are not this one's (docs/50).
    board_atom
    board_matrix
    board_paper
    board_tkoala
    hal_tkoala
    ; The radio and the TLS are the system's (docs/50): Arduino's network classes are outside the build.
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

; **The LilyGO TTGO T-Koala**: an ESP32-WROVER-B with 4 MB of flash, 8 MB of PSRAM (4 MB mapped), a green
; LED on GPIO5 and a microSD slot on the exposed HSPI pins (docs/50). It has no screen, no sensor and no
; key the firmware can read, so the console and the light are the whole of its interface.
;
; The board is not one PlatformIO knows, so its definition is boards/ttgo-t-koala.json: the WROVER-B is a
; QIO flash with a QSPI PSRAM, and `BOARD_HAS_PSRAM` is what makes the core map the external memory. The
; partition table is the 4 MB one, the same as the ATOM's and the DevKit's: one application slot and a
; 1,4 MB disk.
;
; The identity is the familiar trick: `-Ilib/board_tkoala/include` picks this board's board/identity.h, and
; every other board is ignored (docs/50).
[env:ttgo-t-koala]
platform = espressif32@6.5.0
board = ttgo-t-koala
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
; **The T-Koala carries no apps either** (docs/70).
custom_apps_in_disk = no
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -std=gnu++11
    -Ilib/board_tkoala/include
    ; The app that comes up with the board: empty for the prompt (0.119.0).
    -DLUNOK_HOME_APP=\"\"
    ; The stack of the loop task is 16 KB: the UI of a page of controls, the reader of a font of outlines and
    ; the interpreter all run in that one task (docs/75).
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_emulator
    pal_host
    ; The other four identities and their HALs: one per environment (docs/50).
    hal_atom
    hal_paper
    board_atom
    board_matrix
    board_paper
    board_esp32
    ; The radio and the TLS are the system's (docs/50): Arduino's network classes are outside the build.
