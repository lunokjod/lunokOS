; lunokOS - eight environments: the ATOM, the ATOM Matrix, the Paper, the ESP32 DevKit, the T-Koala, the
; LilyGO T5 E-Paper S3 Pro, the PC emulator and the tests. See docs/80-compilacio-i-proves.md for the reason
; behind each line.

[platformio]
; **L'entorn per defecte és el de les proves** (0.179.56): `pio test` sense `-e` agafa aquest valor, i fins avui era
; `emulator` —un entorn que no és de proves, que no enllaça el PAL i que a més escriu el binari de les suites a sobre
; del `program` de l'emulador (mesurat el 13/11: `pio test` hi deixava `43 Tests 0 Failures` al camí que hom executa
; per mirar el vidre, i `pio run -e emulator` deia que estava al dia)—. **Cada compilació d'aquest projecte diu el seu
; entorn** (`pio run -e emulator`, `-e m5-paper`…), i el que no el diu és `pio test`, que vol les proves.
default_envs = test
; **Every build has its own disk, `build/disk/<env>`**, assembled by `tools/make_disk.py` from `data/` (what
; the repository holds: the system's `res/` and `data/`) and from the apps of `apps/` that this build carries,
; whose folders are links to the root. There is no `data_dir` here on purpose: one value for the whole project
; meant that building the ATOM changed the disk the Paper was built from, so the script points
; `$PROJECT_DATA_DIR` at the environment's own tree (docs/70, docs/80). It is generated, and not committed.
; The M5 Paper is not a board this platform knows, so its definition lives in the
; project and this line is what makes PlatformIO look there: `boards/` next to
; platformio.ini, and `board = m5stack-paper` in the environment (docs/80).
boards_dir = boards
; The board is chosen by an include path, not by a macro: every board is a library
; of its own (lib/board_<id>/) with board/identity.h and board/impl.h, same names
; inside and its own content, and the -I below decides which one is seen (docs/50).
; No file of the project writes #ifdef for a board.
; The identity is not inside lib/hal_atom/ because that HAL is the whole ATOM
; family and serves two boards: two headers with that name inside one library would
; both be on the include path and order would decide, silently. Two libraries plus
; `lib_ignore` leave exactly one on each environment (docs/50).
; src/board_link.cpp is the file that names the libraries of the band, and that is
; how PlatformIO's dependency finder knows they belong to the build. Do not touch
; lib_ldf_mode without reading that file first.

; Warnings are errors ONLY in our own libraries (build.flags of each library.json).
; They are not set here because build_flags also reaches the Arduino framework,
; which has warnings of its own and is not ours to fix.

; **The ESP32 platform is pinned** (6.5.0): the framework and the compiler decide the flash and RAM the
; README measures, and a newer espressif32 ships the Arduino core as `framework-arduinoespressif32-esp32-libs`,
; whose deprecated `driver/adc.h` emits a `#warning` that the project's `-Werror` turns into a failed build
; (`hal_esp32/battery.cpp`). A number is measured with a toolchain or not at all (docs/75, docs/80).
[env:m5-atom]
platform = espressif32@6.5.0
board = m5stack-atom
framework = arduino
board_build.partitions = partitions.csv
; Tells PlatformIO which filesystem to build for `-t buildfs`/`-t uploadfs` and,
; with it, which partition in the table is the data one.
board_build.filesystem = littlefs
; The image tool drops any name in data/ longer than 32 characters and still lets
; PlatformIO report SUCCESS. This script turns that silent drop into a failed
; build (docs/70).
; `make_disk` runs first: it is what puts `data/` and the apps that name this board together into the disk
; this environment is flashed with (docs/80).
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
; **A board's image is the system alone unless that board asks for an app** (8/11, the owner: *«cap placa ha de
; contenir apps al flashejar»*): the image of a board is `res/`, `http/`, `data/` and nothing of `apps/`, and an app
; gets there with a card, with `repo install`, or by asking for it here. Two ways to carry apps, and both are in
; docs/70 («Com afegir apps a la imatge del disc»): `custom_apps = id1,id2` for exactly those, and
; `custom_apps_in_disk = yes` for the ones that name this board (docs/40). **Two boards of this tree ask, and both are
; the owner's**: the Paper carries every app that names it (`custom_apps_in_disk = yes`, 0.179.16) and the Matrix
; carries the demo of its panel (`custom_apps = rainbow`, 0.179.19, said in its own section below). It is not a detail:
; `apps/` is **59 files and 475 821 B** (measured on 12/11, with `rainbow`) and the disk of a 4 MB board is
; 1 441 792 B of LittleFS, and what fits is what `make_disk` says on every build —it runs the image tool and stops the
; build when the tool would leave a file out— so a board that carries apps is a board whose image is a lie the day an
; app is edited (docs/70, docs/80).
custom_apps_in_disk = no
monitor_speed = 115200
; If the monitor toggles DTR/RTS when it opens the port, the board resets and the
; reset leaves a run of 0x00 on the line. With both at 0 there is no reset and no
; junk. To restart by hand, the button.
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -std=gnu++11
    -Ilib/board_atom/include
    ; **The app this board comes up with** (0.119.0): the id of a Lua app of the disk —a launcher, a clock, the
    ; page a person wants to see— or empty for the prompt, which is what a board did until now. It is only a
    ; default: `cfg home <id>` overrides it on the board's own store and `cfg home none` puts the prompt back
    ; (docs/30, docs/40). The ATOM has no glass, so nothing here.
    -DLUNOK_HOME_APP=\"\"
    ; **The stack of the loop task is 16 KB and not the 8 the core defaults to**: the UI of a page of
    ; controls, the reader of a TrueType font and the interpreter all run in that one task, and a
    ; `run buttons` on the Paper rebooted with a corrupted backtrace at 8 (docs/75). The macro is the
    ; core's own (`cores/esp32/main.cpp`), and what is left is printed by `mem`.
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_emulator
    pal_host
    ; The other boards' identities: with two of them on the include path, which
    ; board/identity.h is seen would depend on the order of `lib/` (docs/50).
    board_matrix
    board_paper
    ; The plain ESP32's identity is not this board's either, and neither is the T-Koala's (docs/80).
    board_esp32
    board_tkoala
    hal_tkoala
    ; The radio and the TLS are the system's (docs/50): the download is
    ; esp_http_client and esp-tls, not Arduino's HTTPClient. The finder pulled
    ; WiFiClientSecure in when it saw esp_crt_bundle.h and failed on `WiFi.h`,
    ; which is the same detour the WiFi class already cost in flash (docs/50).
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

; **The LilyGO T5 E-Paper S3 Pro** (the board's repository calls it T5S3-4.7-e-paper-PRO, and its
; own board id is `H752-01`) is the first board of this project whose chip is not the ESP32-D0WDQ6:
; it is an **ESP32-S3-WROOM-1** with 16 MB of flash and 8 MB of OPI PSRAM, and that is why this
; environment is written apart from the Paper's even though the two boards look alike from the
; outside (a 4.7 inch e-ink panel and a finger on it) — docs/50 has the sheet.
;
; What is different, in the order a person meets it:
;   - the panel is an **ED047TC1 with no controller**: 960 x 540 and sixteen levels, and the chip
;     drives it itself over an 8-bit parallel bus. Its supply is a TPS65185 behind a PCA9535. **El
;     driver hi és des de la 0.190.59** i és `lib/epdiy`, la llibreria que el repositori de la placa
;     porta i que el seu firmware de fàbrica fa anar, amb la forma d'ona del fabricant (TC2); o sigui
;     que la identitat diu `LUNOK_GLASS 1` i aquesta placa té pàgina, controls, cares i barra
;     (docs/50, docs/90);
;   - **8 MB of PSRAM, all of it mappable** (the S3 has no 4 MB window like the ESP32's), which is
;     what the ceiling of an app on this board answers (docs/75);
;   - the console is the chip's **UART0 on GPIO43/GPIO44**, and those two pins also go to the GPS
;     module of this board: the module hears everything the system prints and nothing of it is a
;     command, which is the same situation the Paper is in with its bridge (docs/50);
;   - the card is on **SPI2** (CS 12, SCK 14, MOSI 13, MISO 21) and the panel does not share it,
;     because the panel is not on a bus of the SPI kind at all (docs/50, docs/70).
; **L'ATOM en el build d'ESP-IDF** (0.190.168, l'amo: *«pots portar l'atom?»*): la placa més petita del sistema —4 MB de flaix, 327 KB de
; RAM i cap PSRAM— amb el `sdkconfig` a les nostres mans. El que aquesta placa demana i el Paper no és una peça de codi: el seu llum és una
; tira de WS2812 i la trama s'escriu amb el RMT, que amb el nucli d'Arduino és `rmtWriteBlocking` i amb la IDF és `rmt_write_items` (el
; mateix ítem de quatre bytes i el mateix tic de cent nanosegons).
[env:m5-atom-idf]
platform = espressif32@6.5.0
board = m5stack-atom
framework = espidf
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
custom_apps_in_disk = no
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults.m5-atom-idf"
build_flags =
    -std=gnu++11
    -Ilib/board_atom/include
    -DLUNOK_HOME_APP=\"\"
    -Wno-error=cpp
    -Wno-deprecated-declarations
    -Wno-error=format
    -Wno-error=volatile
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_emulator
    pal_host
    board_matrix
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala
    hal_paper
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

; **El Matrix, el mateix xip amb vint-i-cinc llums en lloc d'una** (0.190.169, l'amo: *«fes el matrix-idf»*): és l'entorn de l'ATOM amb la
; identitat de la placa i la demo del seu panell al disc, o sigui que el que canvia és el que canviava a l'Arduino. **El fill reemplaça la
; llista del pare i no l'estén**, i per això els `-Wno-error` hi són tornats a dir (docs/50, docs/80).
; **El Matrix, el mateix xip amb vint-i-cinc llums en lloc d'una** (0.190.169, l'amo: *«fes el matrix-idf»*): és l'entorn de l'ATOM amb la
; identitat de la placa i la demo del seu panell al disc. **No fa servir `extends` a propòsit**: amb el pare, la compilació d'IDF ajunta els
; `-I` dels dos i el de `board_atom` va primer, o sigui que el build del Matrix deia `m5stack-atom` a `sys.board` i la seva tira era la de
; l'AIRE (trobat comparant els literals de l'`elf`, no compilant a cegues). Escrit sencer, el que hi ha és el que mana (docs/50, docs/80).
[env:m5-atom-matrix-idf]
platform = espressif32@6.5.0
board = m5stack-atom
framework = espidf
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
custom_apps = rainbow
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
