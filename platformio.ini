; lunokOS - seven environments: the ATOM, the ATOM Matrix, the Paper, the ESP32 DevKit, the T-Koala, the
; PC emulator and the tests. See docs/80-compilacio-i-proves.md for the reason behind each line.

[platformio]
default_envs = emulator
; **Every build has its own disk, `build/disk/<env>`**, assembled by `tools/make_disk.py` from `data/` (what
; the repository holds: the system's `res/` and `data/`) and from the apps of `apps/` that this build carries,
; whose folders are links to the root. There is no `data_dir` here on purpose: one value for the whole project
; meant that building the ATOM changed the disk the Paper was built from, so the script points
; `$PROJECT_DATA_DIR` at the environment's own tree (docs/70, docs/80). It is generated, and not committed.
; The M5 Paper is not a board this platform knows, so its definition lives in the
; project and this line is what makes PlatformIO look there: `boards/` next to
; platformio.ini, and `board = m5stack-paper` in the environment (docs/80).
boards_dir = boards
; The board is chosen by an include path, not by a macro: every board is a library
; of its own (lib/board_<id>/) with board/identity.h and board/impl.h, same names
; inside and its own content, and the -I below decides which one is seen (docs/50).
; No file of the project writes #ifdef for a board.
; The identity is not inside lib/hal_atom/ because that HAL is the whole ATOM
; family and serves two boards: two headers with that name inside one library would
; both be on the include path and order would decide, silently. Two libraries plus
; `lib_ignore` leave exactly one on each environment (docs/50).
; src/board_link.cpp is the file that names the libraries of the band, and that is
; how PlatformIO's dependency finder knows they belong to the build. Do not touch
; lib_ldf_mode without reading that file first.

; Warnings are errors ONLY in our own libraries (build.flags of each library.json).
; They are not set here because build_flags also reaches the Arduino framework,
; which has warnings of its own and is not ours to fix.

; **The ESP32 platform is pinned** (6.5.0): the framework and the compiler decide the flash and RAM the
; README measures, and a newer espressif32 ships the Arduino core as `framework-arduinoespressif32-esp32-libs`,
; whose deprecated `driver/adc.h` emits a `#warning` that the project's `-Werror` turns into a failed build
; (`hal_esp32/battery.cpp`). A number is measured with a toolchain or not at all (docs/75, docs/80).
[env:m5-atom]
platform = espressif32@6.5.0
board = m5stack-atom
framework = arduino
board_build.partitions = partitions.csv
; Tells PlatformIO which filesystem to build for `-t buildfs`/`-t uploadfs` and,
; with it, which partition in the table is the data one.
board_build.filesystem = littlefs
; The image tool drops any name in data/ longer than 32 characters and still lets
; PlatformIO report SUCCESS. This script turns that silent drop into a failed
; build (docs/70).
; `make_disk` runs first: it is what puts `data/` and the apps that name this board together into the disk
; this environment is flashed with (docs/80).
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
; **The apps that name this board**, by its id or by its chip family (`esp32`), which is the rule the kernel
; uses at `run` (docs/40): the disk of the ATOM carries the generic examples plus `light` and `keys`, the ones
; that ask for its own hardware. Measured on 3/11 that is 124 files and about 1 523 712 B of LittleFS against a
; partition of 917 504 B, so `-t buildfs` on a 4 MB board stops and says it, instead of writing an image with
; fifteen files missing (docs/70, docs/80).
custom_apps_in_disk = yes
monitor_speed = 115200
; If the monitor toggles DTR/RTS when it opens the port, the board resets and the
; reset leaves a run of 0x00 on the line. With both at 0 there is no reset and no
; junk. To restart by hand, the button.
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -std=gnu++11
    -Ilib/board_atom/include
    ; **The stack of the loop task is 16 KB and not the 8 the core defaults to**: the UI of a page of
    ; controls, the reader of a TrueType font and the interpreter all run in that one task, and a
    ; `run buttons` on the Paper rebooted with a corrupted backtrace at 8 (docs/75). The macro is the
    ; core's own (`cores/esp32/main.cpp`), and what is left is printed by `mem`.
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    hal_emulator
    pal_host
    ; The other boards' identities: with two of them on the include path, which
    ; board/identity.h is seen would depend on the order of `lib/` (docs/50).
    board_matrix
    board_paper
    ; The plain ESP32's identity is not this board's either, and neither is the T-Koala's (docs/80).
    board_esp32
    board_tkoala
    hal_tkoala
    ; The radio and the TLS are the system's (docs/50): the download is
    ; esp_http_client and esp-tls, not Arduino's HTTPClient. The finder pulled
    ; WiFiClientSecure in when it saw esp_crt_bundle.h and failed on `WiFi.h`,
    ; which is the same detour the WiFi class already cost in flash (docs/50).
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

; The ATOM Matrix is the Lite's twin for everything PlatformIO decides: the same
; ESP32-PICO-D4, the same 4 MB of flash, the same table, the same button on GPIO39
; and the same console, so `board =` is the same and every option is inherited
; instead of copied. What it is not is the same board: it has a 5 by 5 panel of
; twenty-five lights on GPIO27 where the Lite has one, and `sys.board` has to be
; able to say so (docs/50). That is the whole difference and it is two things: this
; include path and the `led_count()` inside it. build_flags and lib_ignore are
; written again because a child section replaces the parent's list, it does not
; extend it — and `board_atom` has to go, or the Lite's identity would be the one
; the finder sees.
[env:m5-atom-matrix]
extends = env:m5-atom
build_flags =
    -std=gnu++11
    -Ilib/board_matrix/include
    ; The child replaces its father's list instead of extending it: the stack is said again (docs/75).
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    hal_emulator
    pal_host
    board_atom
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

[env:emulator]
platform = native
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=c++11
    -Ilib/hal_emulator/include
    ; **The disk this binary reads**, and it is this build's own: `make_disk` assembles `build/disk/emulator`
    ; and the code of the bench takes the path from here, so the bench and the tests cannot write over each
    ; other's disk (docs/80, docs/85).
    -DLUNOK_DISK_DIR=\"build/disk/emulator\"
; **The window of the bench** (`--gui`): SDL2 when it is installed, Xlib as the POSIX fallback, and a
; bench with no window when neither is there. `LUNOK_GUI=sdl|x11|none` forces one; SDL2_CFLAGS and
; SDL2_LIBS let a build point at a copy that pkg-config does not know (docs/85).
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/select_gui.py
; **The bench carries no app at all** (0.88.2): not on its flash and not on its card. Its disk is the system
; (`res/`, `http/`, `data/`) and its card slot is empty until a person puts one there, so `apps` on a fresh bench
; says `no apps` and `run` says it does not know the name. An app gets to the bench the way it gets to a board:
; `repo install <app>`, or a card of one's own with `--sd` (docs/70, docs/80, docs/85).
custom_apps_in_disk = no
lib_ignore =
    hal_atom
    hal_paper
    ; What belongs to the ESP32 is not this band's business either: hal_esp32 talks
    ; to the IDF and the Arduino core, and nothing on the PC includes it (docs/50).
    hal_esp32
    pal_esp32
    ; The board identities of the chips are not this band's business: one of them
    ; inside the include path would hide the emulator's own board/impl.h (docs/50).
    board_atom
    board_matrix
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala

[env:test]
platform = native
test_framework = unity
; src/ is compiled for the tests too: that is where board_link.cpp lives, and it
; is what links the board and the PAL in.
test_build_src = yes
; The tests read the disk the same way the bench does, so they get the same tree
; with the apps in it (docs/80).
extra_scripts =
    pre:tools/make_disk.py
custom_apps_in_disk = yes
; **The apps are copies here and links everywhere else**: a test creates and deletes apps in the disk it
; mounts, and writing through a link would write into the repository (docs/80, docs/85).
custom_apps_copied = yes
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=c++11
    -Ilib/hal_emulator/include
    ; **The tests read their own disk**, `build/disk/test`, assembled by `make_disk` for this environment: a
    ; green suite says nothing about a disk somebody else left behind (docs/80, docs/85).
    -DLUNOK_DISK_DIR=\"build/disk/test\"
lib_ignore =
    hal_atom
    hal_paper
    ; Same reason as the emulator above: the ESP32 parts are not compiled for the PC.
    hal_esp32
    pal_esp32
    ; Same reason as the emulator above: one identity per environment.
    board_atom
    board_matrix
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala

; The M5 Paper (v1.0 and v1.1, the same firmware: docs/50) is the second chip this
; project builds for and it shares almost nothing with the ATOM: 16 MB of flash
; instead of 4, 8 MB of PSRAM, a 4.7" e-ink panel on an IT8951E, a touch panel, a
; clock chip with a coin cell, three keys and no light at all. It is not `extends`
; the ATOM's environment for that reason: the partition table, the board and the
; HAL are different, and inheriting would only hide which of them is which.
;
; The identity is the familiar trick: `-Ilib/board_paper/include` picks this
; board's board/identity.h, and every other board is ignored (docs/50).
[env:m5-paper]
platform = espressif32@6.5.0
board = m5stack-paper
framework = arduino
; 4 MB for the application and 11.9 MB for the disk: an app that keeps a book
; wants the room (partitions_16mb.csv).
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
; **The Paper's partition is 11,9 MB and the apps fit in it**: 1 310 720 B of
; LittleFS for the 113 files of `apps/`, measured on 3/11 (docs/70).
custom_apps_in_disk = yes
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -std=gnu++11
    -Ilib/board_paper/include
    ; **The stack of the loop task is 16 KB** and not the 8 the core defaults to: the UI of a page of
    ; controls, the reader of a TrueType font and the interpreter all run in that one task, and
    ; `run buttons` on this board rebooted with a corrupted backtrace at 8 (docs/75).
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    hal_emulator
    pal_host
    ; The ATOM's HAL and both of its identities: this band has one identity and
    ; one HAL of its own (docs/50).
    hal_atom
    board_atom
    board_matrix
    board_esp32
    board_tkoala
    hal_tkoala
    ; The radio and the TLS are the system's (docs/50): Arduino's network classes
    ; are outside the build on every board.
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

; **The smallest board the system has to fit in**: an ESP32 DevKit of 4 MB of
; flash and 520 KB of RAM, with no PSRAM, no panel, no card, no sensor and no
; button it can press. It exists so that a page of code that only works because
; the Paper has four megabytes of extra memory fails here and not there (docs/80).
;
; It is not `extends` the ATOM's environment even though the chip is the same:
; that one is a board with a light and a button and this one is a bare module, and
; inheriting would hide which of the two numbers is whose.
;
; What the family HAL drives anyway: the light of the family is on GPIO27 and the
; key on GPIO39, and a DevKit has nothing on either —so `led.play` writes to a pin
; with no chip and the dial reads "not pressed" for ever, and the way in and out of
; an app is the console. That is said in the identity header too (docs/50).
[env:esp32-devkit]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
; The bare ESP32 gets the generic examples and nothing that names a board: it has no light, no key and no
; glass, so the ones that name `m5stack-*` are not its own (docs/40). 120 files, about 1 474 560 B of LittleFS
; against 917 504 B: the build stops and says so (docs/70).
custom_apps_in_disk = yes
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -std=gnu++11
    -Ilib/board_esp32/include
    ; **The stack of the loop task is 16 KB** here too: what needs it is the UI of a page of controls and the
    ; reader of a font of outlines, and that is the same on a DevKit as on the Paper (docs/75).
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    hal_emulator
    pal_host
    ; The other four identities: one per environment, and theirs are not this one's (docs/50).
    board_atom
    board_matrix
    board_paper
    board_tkoala
    hal_tkoala
    ; The radio and the TLS are the system's (docs/50): Arduino's network classes are outside the build.
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

; **The LilyGO TTGO T-Koala**: an ESP32-WROVER-B with 4 MB of flash, 8 MB of PSRAM (4 MB mapped), a green
; LED on GPIO5 and a microSD slot on the exposed HSPI pins (docs/50). It has no screen, no sensor and no
; key the firmware can read, so the console and the light are the whole of its interface.
;
; The board is not one PlatformIO knows, so its definition is boards/ttgo-t-koala.json: the WROVER-B is a
; QIO flash with a QSPI PSRAM, and `BOARD_HAS_PSRAM` is what makes the core map the external memory. The
; partition table is the 4 MB one, the same as the ATOM's and the DevKit's: one application slot and a
; 1,4 MB disk.
;
; The identity is the familiar trick: `-Ilib/board_tkoala/include` picks this board's board/identity.h, and
; every other board is ignored (docs/50).
[env:ttgo-t-koala]
platform = espressif32@6.5.0
board = ttgo-t-koala
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
; The apps that name this board, by its id or by `esp32` (docs/40). The disk is the 1,4 MB of
; partitions.csv: the generic examples and anything that asks for the T-Koala by name.
custom_apps_in_disk = yes
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -std=gnu++11
    -Ilib/board_tkoala/include
    ; The stack of the loop task is 16 KB: the UI of a page of controls, the reader of a font of outlines and
    ; the interpreter all run in that one task (docs/75).
    -DARDUINO_LOOP_STACK_SIZE=16384
lib_ignore =
    hal_emulator
    pal_host
    ; The other four identities and their HALs: one per environment (docs/50).
    hal_atom
    hal_paper
    board_atom
    board_matrix
    board_paper
    board_esp32
    ; The radio and the TLS are the system's (docs/50): Arduino's network classes are outside the build.
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv
