; **The LilyGO T5 E-Paper S3 Pro** (the board's repository calls it T5S3-4.7-e-paper-PRO, and its
; own board id is `H752-01`) is the first board of this project whose chip is not the ESP32-D0WDQ6:
; it is an **ESP32-S3-WROOM-1** with 16 MB of flash and 8 MB of OPI PSRAM, and that is why its
; environment is written apart from the Paper's even though the two boards look alike from the
; outside (a 4.7 inch e-ink panel and a finger on it) — docs/50 has the sheet.
;
; What is different, in the order a person meets it:
;   - the panel is an **ED047TC1 with no controller**: 960 x 540 and sixteen levels, and the chip
;     drives it itself over an 8-bit parallel bus. Its supply is a TPS65185 behind a PCA9535. **El
;     driver hi és des de la 0.190.59** i és `lib/epdiy`, la llibreria que el repositori de la placa
;     porta i que el seu firmware de fàbrica fa anar, amb la forma d'ona del fabricant (TC2); o sigui
;     que la identitat diu `LUNOK_GLASS 1` i aquesta placa té pàgina, controls, cares i barra
;     (docs/50, docs/90);
;   - **8 MB of PSRAM, all of it mappable** (the S3 has no 4 MB window like the ESP32's), which is
;     what the ceiling of an app on this board answers (docs/75);
;   - the console is the chip's **UART0 on GPIO43/GPIO44**, and those two pins also go to the GPS
;     module of this board: the module hears everything the system prints and nothing of it is a
;     command, which is the same situation the Paper is in with its bridge (docs/50);
;   - the card is on **SPI2** (CS 12, SCK 14, MOSI 13, MISO 21) and the panel does not share it,
;     because the panel is not on a bus of the SPI kind at all (docs/50, docs/70).
[env:lilygo-t5s3-idf]
platform = espressif32@6.5.0
board = lilygo-t5s3-epaper-pro
framework = espidf
; 4 MB for the application and 11.9 MB for the disk: the same table the Paper uses (docs/70).
board_build.partitions = partitions_16mb.csv
; **I el disc, el mateix que el de l'entorn d'Arduino** (0.190.90): `make_disk.py` el compon a `build/disk/<env>` —les apps que el
; manifest de cada una diu que són d'aquesta placa, la splash feta pla, les fonts i el llibre— i el deixa a `$PROJECT_DATA_DIR`, i el
; `mklittlefs` de la plataforma el converteix en la imatge de la partició que diu la taula. O sigui que aquest entorn no és mitja placa:
; porta les mateixes apps que el de sempre (docs/70, docs/80).
board_build.filesystem = littlefs
; **La velocitat de gravat no es diu aquí**: viu a `boards/lilygo-t5s3-epaper-pro.json` (921600, la de la guia del fabricant) i val per
; a tots els entorns d'aquesta placa, que és el que ha de ser (docs/50, docs/80).
; **I les mateixes apps que l'entorn d'Arduino, per la mateixa regla** (0.190.80): cada carpeta d'`apps/` el manifest de la qual
; anomena aquesta placa o la família `esp32`. Una llista escrita a mà es queda vella; la regla no (docs/40, docs/70).
custom_apps_in_disk = yes
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
; **I el Bluetooth, en un fitxer de més** (0.190.198): `SDKCONFIG_DEFAULTS` és una llista, o sigui que el `sdkconfig.defaults` que
; aquesta placa ja fa servir es queda com és i el ràdio s'afegeix des d'un segon fitxer. Dues còpies del mateix s'haurien desdit.
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults;${PROJECT_DIR}/sdkconfig.defaults.lilygo-t5s3-idf"
build_flags =
    -std=gnu++11
    -Ilib/board_t5s3/include
    -DLUNOK_HOME_APP=\"home_eink\"
    ; **La consola és el USB del xip** (docs/50): aquesta placa no porta cap pont i la UART0 va al GPS, o sigui que el prompt surt pel
    ; perifèric USB-Serial-JTAG del propi ESP32-S3 i no per la UART.
    -DLUNOK_CONSOLE_USB=1
    ; **Els avisos de la IDF no són errors aquí**: el build d'Arduino no en té cap perquè la seva configuració no marca com a error els
    ; `#warning` del driver d'ADC antic, i el codi que els provoca (`battery`, el gauge, el tàctil) funciona igual. Migrar-lo a
    ; `adc_oneshot` és una feina a part i no ha de fer caure l'entorn de prova (docs/50, docs/80).
    -Wno-error=cpp
    -Wno-deprecated-declarations
    ; I els `printf` d'epdiy, que són de la seva lliberry i no nostres: la IDF 5 els mira amb `-Werror=format` i la 4.4 d'Arduino no
    ; (docs/50, docs/80).
    -Wno-error=format
    ; **`-Wno-error=volatile` i no `-Wno-volatile`** (0.190.90): `uart_ll.h` de la IDF fa assignacions compostes sobre un `volatile` i el
    ; GCC 12 ho marca obsolet, però aquesta bandera només existeix per a C++ i `build_flags` arriba també als fitxers `.c` —amb la forma
    ; forta, cada un dels centenars de `.c` de la IDF cridava que la bandera no era seva (971 línies en una compilació neta). Amb
    ; `-Wno-error` els dos avisos del seu capçalera es queden com a avisos i la compilació calla (docs/50, docs/80).
    -Wno-error=volatile
    ; **Els canaris de la memòria, encesos a propòsit** (0.190.101, l'amo: *«millor fem les proves que volies fer amb els canaris i tota
    ; la pesca»*): every block of the extra memory carries a head and a tail with its size, o sigui que una escriptura més enllà del que
    ; es va demanar es veu al primer `release`/`resize` d'aquell bloc en comptes de fer caure el `tlsf` sense dir res. És un build de
    ; diagnòstic — trenta-dos bytes per bloc i una còpia a cada `resize`— i el dia que el forat estigui tapat, aquesta línia marxa
    ; (docs/75, docs/95).
    -DLUNOK_MEMORY_GUARDS=1
lib_ignore =
    hal_emulator
    pal_host
    board_atom
    board_matrix
    board_esp32
    board_paper
    board_tkoala
    hal_atom
    hal_paper
    hal_tkoala
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

[env:emulator]
platform = native
; **Aquest entorn no és de proves i no en pot ser** (0.179.56): una compilació de proves a l'entorn de l'emulador no
; enllaça el PAL (`src/board_link.cpp` no es compila sense `test_build_src`) i escriu el binari de les suites al
; mateix `program` que hom executa per mirar el vidre. Les proves viuen a `[env:test]`, que té el seu disc i el seu
; `LUNOK_HOME_APP` buit, i `pio test` hi va sol des de 0.179.56 (`default_envs`). Aquí no hi ha cap suite.
test_ignore = *
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=c++11
    -Ilib/hal_emulator/include
    ; **The app the emulator comes up with: the launcher** (0.155.0, and it is the owner's ask: *«que l'emulador arrenqui
    ; amb el paràmetre --gui i l'app per defecte home_eink»*). The emulator has a glass and three keys, so the page a
    ; person wants to see is the grid of the apps, and back to it when the app they opened ends (docs/30, docs/40).
    ; **It is the app the disk carries** (`custom_apps_in_disk` below, which since 8/11 puts every app of `apps/`
    ; on the emulator's disk, the launcher among them), and `--no-gui` and `cfg home none` are the two ways
    ; out of it without a build. No test is affected: the suite has its own environment with the home app empty.
    -DLUNOK_HOME_APP=\"home_eink\"
    ; **The window is what this emulator comes up with** (0.155.0): the run opens the glass in a window without being
    ; asked, because an emulator that shows nothing is an emulator one has to remember to ask for a page. A demand is not a
    ; default (`--gui` still refuses `--no-delay` and `--no-ink`, and the default steps aside and says so), and
    ; `--no-gui` is the quiet emulator of a measure (docs/85).
    -DLUNOK_GUI_BY_DEFAULT=1
    ; **The disk this binary reads**, and it is this build's own: `make_disk` assembles `build/disk/emulator`
    ; and the code of the emulator takes the path from here, so the emulator and the tests cannot write over each
    ; other's disk (docs/80, docs/85).
    -DLUNOK_DISK_DIR=\"build/disk/emulator\"
; **The window of the emulator**: SDL2 when it is installed, Xlib as the POSIX fallback, and an emulator with no
; window when neither is there (in which case `LUNOK_GUI_BY_DEFAULT` prints that there is no window and the run
; goes on with the console). `LUNOK_GUI=sdl|x11|none` forces one; SDL2_CFLAGS and SDL2_LIBS let a build point at
; a copy that pkg-config does not know (docs/85).
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/select_gui.py
; **The emulator carries every app of `apps/`** (8/11, the owner: *«afegeix totes les apps a l'emulador»*). Until
; today it carried the launcher alone —the app it comes up with has to be on the disk it reads— and the rest stayed
; out, so a fresh emulator showed a grid with one cell. `custom_apps_in_disk = yes` keeps **the apps that name this
; board**, and the emulator has no board, so the rule of `make_disk` keeps them all: 9 folders, 42 files, 331 536 B on
; this machine, and they go in as **links** —an edit of an app is read by the next run—. A board is what keeps a
; short list (`m5-paper-idf` names its six): its 4 MB of LittleFS do not hold `apps/` (docs/70, docs/85).
custom_apps_in_disk = yes
; **The card is not filled by the build** (11/11, the owner: *«treu les apps del SD per ara»*): the emulator's
; apps are the disk's, and the card in its slot is a directory of this machine that a person fills —with `repo
; install`, with a hand— exactly like the card of a board. It used to be seeded with a link per app (10/11) and that
; showed every app twice in the door of `/apps`, once from each volume (docs/70, docs/85).
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_atom
    hal_paper
    ; What belongs to the ESP32 is not this band's business either: hal_esp32 talks
    ; to the IDF and the Arduino core, and nothing on the PC includes it (docs/50).
    hal_esp32
    pal_esp32
    ; The board identities of the chips are not this band's business: one of them
    ; inside the include path would hide the emulator's own board/impl.h (docs/50).
    board_atom
    board_matrix
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala

[env:test]
platform = native
test_framework = unity
; src/ is compiled for the tests too: that is where board_link.cpp lives, and it
; is what links the board and the PAL in.
test_build_src = yes
; The tests read the disk the same way the emulator does, so they get the same tree
; with the apps in it (docs/80).
extra_scripts =
    pre:tools/make_disk.py
custom_apps_in_disk = yes
; **The apps are copies here and links everywhere else**: a test creates and deletes apps in the disk it
; mounts, and writing through a link would write into the repository (docs/80, docs/85).
custom_apps_copied = yes
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=c++11
    -Ilib/hal_emulator/include
    ; **None, and it is not a detail** (0.119.0): every test boots the kernel, so a home app here would open an app
    ; in the middle of a case. The cases that want one set it themselves (docs/30, docs/85).
    -DLUNOK_HOME_APP=\"\"
    ; **The tests read their own disk**, `build/disk/test`, assembled by `make_disk` for this environment: a
    ; green suite says nothing about a disk somebody else left behind (docs/80, docs/85).
    -DLUNOK_DISK_DIR=\"build/disk/test\"
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_atom
    hal_paper
    ; Same reason as the emulator above: the ESP32 parts are not compiled for the PC.
    hal_esp32
    pal_esp32
    ; Same reason as the emulator above: one identity per environment.
    board_atom
    board_matrix
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala

; The M5 Paper (v1.0 and v1.1, the same firmware: docs/50) is the second chip this
; project builds for and it shares almost nothing with the ATOM: 16 MB of flash
; instead of 4, 8 MB of PSRAM, a 4.7" e-ink panel on an IT8951E, a touch panel, a
; clock chip with a coin cell, three keys and no light at all. It is not `extends`
; the ATOM's environment for that reason: the partition table, the board and the
; HAL are different, and inheriting would only hide which of them is which.
;
; The identity is the familiar trick: `-Ilib/board_paper/include` picks this
; board's board/identity.h, and every other board is ignored (docs/50).
[env:m5-paper-idf]
platform = espressif32@6.5.0
board = m5stack-paper
framework = espidf
; La mateixa taula de particions i el mateix disc que tenia l'entorn d'Arduino d'aquesta placa, que ja no hi és (docs/70).
board_build.partitions = partitions_16mb.csv
board_build.filesystem = littlefs
custom_apps_in_disk = yes
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
; **La configuració d'aquesta placa i no la del S3** (vegeu el comentari de dalt).
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults.m5-paper-idf"
build_flags =
    -std=gnu++11
    -Ilib/board_paper/include
    -DLUNOK_HOME_APP=\"home_eink\"
    ; **Els avisos i els `printf` de les lliberries no són errors aquí**: la IDF 5 mira el format amb `-Werror` i el driver vell de l'ADC
    ; crida la seva pròpia obsoletessa, que és el mateix que l'entorn del T5S3 ja diu (docs/50, docs/80).
