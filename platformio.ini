; lunokOS - eight environments: the ATOM, the ATOM Matrix, the Paper, the ESP32 DevKit, the T-Koala, the
; LilyGO T5 E-Paper S3 Pro, the PC emulator and the tests. See docs/80-compilacio-i-proves.md for the reason
; behind each line.

[platformio]
; **L'entorn per defecte és el de les proves** (0.179.56): `pio test` sense `-e` agafa aquest valor, i fins avui era
; `emulator` —un entorn que no és de proves, que no enllaça el PAL i que a més escriu el binari de les suites a sobre
; del `program` de l'emulador (mesurat el 13/11: `pio test` hi deixava `43 Tests 0 Failures` al camí que hom executa
; per mirar el vidre, i `pio run -e emulator` deia que estava al dia)—. **Cada compilació d'aquest projecte diu el seu
; entorn** (`pio run -e emulator`, `-e m5-paper-idf`…), i el que no el diu és `pio test`, que vol les proves.
default_envs = test
; **Every build has its own disk, `build/disk/<env>`**, assembled by `tools/make_disk.py` from `data/` (what
; the repository holds: the system's `res/` and `data/`) and from the apps of `apps/` that this build carries,
; whose folders are links to the root. There is no `data_dir` here on purpose: one value for the whole project
; meant that building the ATOM changed the disk the Paper was built from, so the script points
; `$PROJECT_DATA_DIR` at the environment's own tree (docs/70, docs/80). It is generated, and not committed.
; The M5 Paper is not a board this platform knows, so its definition lives in the
; project and this line is what makes PlatformIO look there: `boards/` next to
; platformio.ini, and `board = m5stack-paper` in the environment (docs/80).
boards_dir = boards
; The board is chosen by an include path, not by a macro: every board is a library
; of its own (lib/board_<id>/) with board/identity.h and board/impl.h, same names
; inside and its own content, and the -I below decides which one is seen (docs/50).
; No file of the project writes #ifdef for a board.
; The identity is not inside lib/hal_atom/ because that HAL is the whole ATOM
; family and serves two boards: two headers with that name inside one library would
; both be on the include path and order would decide, silently. Two libraries plus
; `lib_ignore` leave exactly one on each environment (docs/50).
; src/board_link.cpp is the file that names the libraries of the band, and that is
; how PlatformIO's dependency finder knows they belong to the build. Do not touch
; lib_ldf_mode without reading that file first.

; Warnings are errors ONLY in our own libraries (build.flags of each library.json). They are not set here because build_flags
; also reaches the frameworks and the IDF, whose warnings are not ours to fix.

; **The ESP32 platform is pinned** (6.5.0, i és la que porta l'ESP-IDF 5.1.2 amb el GCC 12.2.0 de la toolchain): those two decide the
; flash and RAM the README measures, i un espressif32 més nou porta una altra IDF —una altra toolchain, un altre heap, una altra mida—
; i les mesures de docs/75 deixen de ser del mateix binari. **I és aquesta IDF 5 la que decideix els `-Wno-error` dels sis entorns**:
; les seves pròpies capçaleres (`driver/adc.h`, `uart_ll.h`) i els `printf` d'epdiy passen per `-Werror` amb codi que no és nostre
; (docs/50). A number is measured with a toolchain or not at all (docs/75, docs/80).
[env:m5-atom-idf]
platform = espressif32@6.5.0
board = m5stack-atom
framework = espidf
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
custom_apps_in_disk = no
extra_scripts =
    pre:tools/make_disk.py
    pre:tools/check_fs_names.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults.m5-atom-idf"
build_flags =
    -std=gnu++11
    -Ilib/board_atom/include
    -DLUNOK_HOME_APP=\"\"
    -Wno-error=cpp
    -Wno-deprecated-declarations
    -Wno-error=format
    -Wno-error=volatile
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_emulator
    pal_host
    board_matrix
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala
    hal_paper
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

