monitor_rts = 0
monitor_dtr = 0
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="${PROJECT_DIR}/sdkconfig.defaults.m5-atom-idf"
build_flags =
    -std=gnu++11
    -Ilib/board_matrix/include
    -DLUNOK_HOME_APP=\"\"
    -Wno-error=cpp
    -Wno-deprecated-declarations
    -Wno-error=format
    -Wno-error=volatile
lib_ignore =
    board_t5s3
    hal_t5s3
    hal_emulator
    pal_host
    ; **La identitat de l'ATOM sí i el seu HAL no**: `board/impl.h` del Matrix en crida l'`hal_atom.h`, o sigui que el HAL és el
    ; mateix i el que canvia és qui diu quin board és (docs/50).
    board_atom
    board_paper
    board_esp32
    board_tkoala
    hal_tkoala
    hal_paper
    WiFi
    WiFiClientSecure
    HTTPClient
    ESPmDNS
    WebServer
    DNSServer
    WiFiProv

; **El DevKit en el build d'ESP-IDF** (0.190.170, l'amo: *«ja pots portar la devkit i la koala a idf»*): la placa del mínim amb el
; `sdkconfig` a les nostres mans, que és la de l'ATOM —4 MB, sense PSRAM— i no la del Paper (docs/50, docs/80).
[env:esp32-devkit-idf]
